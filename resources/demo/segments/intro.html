<!doctype html>
<html><head><meta charset="utf-8"><title>Intro: Record once</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0b0d10; }
  canvas { position: absolute; inset: 0; }
  #title { position: absolute; left: 8%; right: 8%; top: 50%; margin: 0; color: #f4f1ea; font: 600 9vh/1.05 system-ui, "Liberation Sans", sans-serif; letter-spacing: -0.02em; }
  #title span { display: inline-block; margin-right: 0.28em; }
</style></head>
<body>
<canvas id="c"></canvas>
<h1 id="title"><span>Record</span><span>once.</span></h1>
<script>
const c = document.getElementById("c"), g = c.getContext("2d");
const W = c.width = innerWidth, H = c.height = innerHeight;
const words = [...document.querySelectorAll("#title span")], title = document.getElementById("title");
const ease = (x) => 1 - Math.pow(1 - Math.min(1, Math.max(0, x)), 3);
// One pure function of t: a lattice of dots rides a travelling wave, a ring of frames closes around the title.
window.takeoneSegment = { seek(t) {
  g.fillStyle = "#0b0d10"; g.fillRect(0, 0, W, H);
  const cols = 48, rows = 27, dx = W / cols, dy = H / rows;
  for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
    const x = (i + 0.5) * dx, y = (j + 0.5) * dy, d = Math.hypot(x - W / 2, y - H / 2) / Math.hypot(W / 2, H / 2);
    const wave = Math.sin(d * 9 - t * 3.2), r = Math.max(0.6, (2 + 2.4 * wave) * (H / 1080)) * ease(t / 0.6);
    g.fillStyle = `rgba(${Math.round(60 + 120 * (wave + 1) / 2)}, ${Math.round(200 - 40 * d)}, 160, ${0.18 + 0.32 * (wave + 1) / 2})`;
    g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  }
  const R = H * (0.62 - 0.12 * ease(t / 1.4));
  g.strokeStyle = "rgba(244,241,234,0.55)"; g.lineWidth = Math.max(1.5, H / 540);
  for (let k = 0; k < 5; k++) { const a = t * 0.5 + k * 1.2566; g.save(); g.translate(W / 2 + Math.cos(a) * R * 0.55, H / 2 + Math.sin(a) * R * 0.55); g.rotate(a);
    g.strokeRect(-H * 0.05, -H * 0.03, H * 0.1, H * 0.06); g.restore(); }
  title.style.transform = "translateY(-50%)";
  words.forEach((w, n) => { const p = ease((t - 0.35 - n * 0.18) / 0.5); w.style.opacity = String(p); w.style.transform = `translateY(${(1 - p) * 0.4}em)`; });
} };
window.takeoneSegment.seek(0);
</script>
</body></html>

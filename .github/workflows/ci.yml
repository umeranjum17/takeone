name: ci
on:
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Install output quality tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr fonts-liberation
      - run: npm run typecheck
      - run: npm test
      - name: Synthetic output quality gates
        if: always()
        run: npm run quality
      - name: Attach quality metrics and review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-quality-${{ github.sha }}
          path: |
            tmp/quality/*.json
            tmp/quality/*/ssim.log
            tmp/quality/*/vmaf.json
            tmp/quality/*/ocr-*.png
            tmp/quality/sharpness/*
            tmp/quality/*/out/*.mp4
          if-no-files-found: error

name: ci
on:
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: Label the change as code or docs
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" \
              | grep -qvE '^(docs/|\.agents/|data/)|^(README\.md|LICENSE)$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  ci:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAKEONE_CHROME: ${{ github.workspace }}/.cache/headless-shell/151.0.7922.34/chrome-headless-shell-linux64/chrome-headless-shell
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Constraint-driven-development Floor
        run: node scripts/floor-guard.mjs --base origin/main
      - run: npm ci
      - name: Install output quality tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr unzip fonts-liberation libnss3 libatk1.0-0 libatk-bridge2.0-0 libx11-6 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64
      - uses: actions/cache@v4
        with:
          path: .cache/headless-shell
          key: headless-shell-linux-x64-151.0.7922.34-3cfc2bd0
      - run: node scripts/install-headless-shell.mjs
      - run: npm run typecheck
      - run: npm test
      - name: Synthetic output quality gates
        if: always()
        run: npm run quality
      - name: Attach quality metrics and review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-quality-${{ github.sha }}
          path: |
            tmp/quality/*.json
            tmp/quality/*/ssim.log
            tmp/quality/*/vmaf.json
            tmp/quality/*/ocr-*.png
            tmp/quality/sharpness/*
            tmp/quality/*/out/*.mp4
          if-no-files-found: error

  done-done:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAKEONE_CHROME: ${{ github.workspace }}/.cache/headless-shell/151.0.7922.34/chrome-headless-shell-linux64/chrome-headless-shell
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install check prerequisites (ffmpeg, fonts, headless shell)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg tesseract-ocr unzip fonts-liberation libnss3 libatk1.0-0 libatk-bridge2.0-0 libx11-6 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64
      - uses: actions/cache@v4
        with:
          path: .cache/headless-shell
          key: headless-shell-linux-x64-151.0.7922.34-3cfc2bd0
      - run: node scripts/install-headless-shell.mjs
      - name: Static checks through done-done
        run: |
          npx -y done-done-axi run checks
          RUN_DIR=$(ls -dt ~/.done-done/evidence/takeone/*/ | head -1)
          npx -y done-done-axi check --outcome "takeone static checks pass on this commit" --claim-id "ci-checks" "${RUN_DIR}"*.log

  headless-scene:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install capture prerequisites
        run: sudo apt-get update && sudo apt-get install -y ffmpeg unzip fonts-liberation libnss3 libatk1.0-0 libatk-bridge2.0-0 libx11-6 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64
      - uses: actions/cache@v4
        with:
          path: .cache/headless-shell
          key: headless-shell-linux-x64-151.0.7922.34-3cfc2bd0
      - run: node scripts/install-headless-shell.mjs
      - name: Capture twice and verify pixels, events, clocks and planning
        run: node scripts/test-headless-scene.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-scene-evidence
          path: |
            tmp/headless-validation/run-*/metrics.json
            tmp/headless-validation/run-*/frames.framemd5
            tmp/headless-validation/run-*/takeone-headless-scene-after.png

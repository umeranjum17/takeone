name: ci
on:
  # No `edited`: no job reads the pull request title or body, so editing them runs nothing. CI
  # never runs on a push to main (the pull request already ran it); release.yml owns main.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A newer push to the same pull request cancels its superseded run; a push to main, a tag
  # or a release run is never cancelled, because cancel-in-progress is false off a pull request.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # A draft pull request runs nothing: this job, `ci` and `headless-scene` are all skipped, a
  # skipped required check satisfies branch protection, and ready_for_review starts the real run.
  changes:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Docs-only: docs, agent skills, data, sign-off board traffic, READMEs, VISION and
      # LICENSE (.done-done.yaml's evidence.ignore_paths plus nested READMEs). CONSTRAINTS.md
      # stays code: the floor guard reads it. No job here may use paths filters: the gate jobs
      # below hold required checks, so they must always run and report.
      - id: diff
        name: Label the change as code or docs
        run: |
          if git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD" \
              | grep -qvE '^(docs/|\.agents/|data/|\.sign-off/)|(^|/)(README|VISION)\.md$|^LICENSE$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAKEONE_CHROME: ${{ github.workspace }}/.cache/headless-shell/151.0.7922.34/chrome-headless-shell-linux64/chrome-headless-shell
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install output quality tools
        timeout-minutes: 20
        run: scripts/ci-apt-install.sh ffmpeg tesseract-ocr zbar-tools unzip fonts-liberation libnss3 libatk1.0-0 libatk-bridge2.0-0 libx11-6 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64
      - uses: actions/cache@v4
        with:
          path: .cache/headless-shell
          key: headless-shell-linux-x64-151.0.7922.34-3cfc2bd0
      - run: node scripts/install-headless-shell.mjs
      - name: Floor guard
        run: node scripts/floor-guard.mjs --base "${{ github.event.pull_request.base.sha }}"
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Synthetic output quality gates
        if: always()
        run: npm run quality -- --fixture synth --fixture portrait
      - name: Attach quality metrics and review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-quality-${{ github.sha }}
          path: |
            tmp/quality/*.json
            tmp/quality/*/ssim.log
            tmp/quality/*/vmaf.json
            tmp/quality/*/ocr-*.png
            tmp/quality/sharpness/*
            tmp/quality/*/out/*.mp4
          if-no-files-found: error

  # The real-UI quality gate: the headless board scene captured, rendered twice and audited on
  # every frame takes about an hour on a runner, so it runs beside the checks job, not in it.
  quality-scene:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TAKEONE_CHROME: ${{ github.workspace }}/.cache/headless-shell/151.0.7922.34/chrome-headless-shell-linux64/chrome-headless-shell
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install output quality tools
        timeout-minutes: 20
        run: scripts/ci-apt-install.sh ffmpeg tesseract-ocr unzip fonts-liberation libnss3 libatk1.0-0 libatk-bridge2.0-0 libx11-6 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64
      - uses: actions/cache@v4
        with:
          path: .cache/headless-shell
          key: headless-shell-linux-x64-151.0.7922.34-3cfc2bd0
      - run: node scripts/install-headless-shell.mjs
      - name: Real-UI output quality gates
        run: npm run quality -- --fixture scene
      - name: Attach scene quality metrics and review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: output-quality-scene-${{ github.sha }}
          path: |
            tmp/quality/*.json
            tmp/quality/scene/ssim.log
            tmp/quality/scene/vmaf.json
            tmp/quality/scene/ocr-*.png
            tmp/quality/scene/out/*.mp4
          if-no-files-found: error

  # The required check `ci`: green on a docs-only change, else only when every check passed.
  ci:
    needs: [changes, checks, quality-scene]
    if: ${{ !cancelled() && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Require static checks and quality gates on a code change
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          CHECKS: ${{ needs.checks.result }}
          SCENE: ${{ needs.quality-scene.result }}
        run: |
          [ "$CHANGES" = success ] || { echo "::error::changes job $CHANGES"; exit 1; }
          if [ "$CODE" != true ]; then echo "docs-only change: static checks and quality gates skipped"; exit 0; fi
          [ "$CHECKS" = success ] || { echo "::error::checks job $CHECKS"; exit 1; }
          [ "$SCENE" = success ] || { echo "::error::quality-scene job $SCENE"; exit 1; }

  # The old single job ran both captures and make in series (~19-32 min). Each part runs on
  # its own runner; the headless-scene gate compares their decoded frames across runners.
  headless-scene-part:
    name: headless-scene (${{ matrix.part }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { part: capture-a, mode: capture }
          - { part: capture-b, mode: capture }
          - { part: render, mode: render }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install capture prerequisites
        timeout-minutes: 20
        run: scripts/ci-apt-install.sh ffmpeg unzip fonts-liberation libnss3 libatk1.0-0 libatk-bridge2.0-0 libx11-6 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64
      - uses: actions/cache@v4
        with:
          path: .cache/headless-shell
          key: headless-shell-linux-x64-151.0.7922.34-3cfc2bd0
      - run: node scripts/install-headless-shell.mjs
      - name: Capture and verify pixels, events and clocks (render part also runs make)
        # Healthy parts take 10-17 min; a wedged one fails here with its log, not at the job's 40.
        timeout-minutes: 22
        run: node scripts/test-headless-scene.mjs --part=${{ matrix.mode }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: headless-scene-${{ matrix.part }}
          path: |
            tmp/headless-validation/run-*/metrics.json
            tmp/headless-validation/run-*/takeone-headless-scene-after.png
            tmp/headless-validation/run-*/a/frames.framemd5
            tmp/headless-validation/run-*/a/events.jsonl
            tmp/headless-validation/run-*/a/frames.tsv

  # The required check `headless-scene`: green on a docs-only change, else only when all three
  # parts passed and their takes are identical.
  headless-scene:
    needs: [changes, headless-scene-part]
    if: ${{ !cancelled() && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: gate
        name: Require every part on a code change
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          PARTS: ${{ needs.headless-scene-part.result }}
        run: |
          [ "$CHANGES" = success ] || { echo "::error::changes job $CHANGES"; exit 1; }
          if [ "$CODE" != true ]; then echo "docs-only change: headless scene parts skipped"; exit 0; fi
          [ "$PARTS" = success ] || { echo "::error::headless-scene parts $PARTS"; exit 1; }
          echo "compare=true" >> "$GITHUB_OUTPUT"
      - if: steps.gate.outputs.compare == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.compare == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: steps.gate.outputs.compare == 'true'
        uses: actions/download-artifact@v4
        with:
          pattern: headless-scene-*
          path: tmp/headless-parts
      - if: steps.gate.outputs.compare == 'true'
        name: Compare decoded frames, input logs and clocks across the parts
        # upload-artifact roots each part at tmp/headless-validation/, so takes sit in run-*/a.
        run: |
          takes=(tmp/headless-parts/*/run-*/a)
          [ "${#takes[@]}" = 3 ] || { echo "::error::expected 3 part takes, found: ${takes[*]}"; exit 1; }
          node scripts/test-headless-scene.mjs --part=compare "${takes[@]}"

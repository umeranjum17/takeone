# done-done project config. `done-done init` never overwrites this file.
# The app name finds this repo's evidence and receipts from every checkout.
app: "takeone"
# This repo's coding agent, over agent in ~/.done-done/config.yaml (model, effort and the other agent settings stay there).
# agent: opencode
# Docs-only commits and sign-off board traffic keep evidence fresh: neither is
# a product change (mirrors the code/docs split in .github/workflows/ci.yml).
evidence:
  ignore_paths: ["docs/**", ".agents/**", "data/**", ".sign-off/**", "README.md", "LICENSE"]
journeys:
  # The verify-takeone canonical offline journey (synthetic take, local-only
  # planning, real render): the MP4, a decoded still and the probe are the evidence.
  offline-render:
    command: npm run build && W=$(mktemp -d) && export TAKEONE_DIR="$W/takes" TAKEONE_STATE_DIR="$W/state" && node scripts/synth-take.ts $W/synth-demo && node bin/takeone.mjs make $W/synth-demo --no-ai && node scripts/verification/visual-check.ts $W/synth-demo --name offline-dark --out $W/check --at 8,12 && mkdir -p $DONE_DONE_EVIDENCE_ROOT/${RUN_ID} && cp $W/check/*.png $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}/ && ffmpeg -y -threads 2 -filter_threads 2 -filter_complex_threads 2 -ss 5 -i $W/synth-demo/out/synth-demo.mp4 -frames:v 1 $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}/takeone-offline-render-after.png && ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,codec_name -of json $W/synth-demo/out/synth-demo.mp4 > $W/probe.json && grep -q '"width":.1920' $W/probe.json && grep -q h264 $W/probe.json && cp $W/synth-demo/out/synth-demo.mp4 $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}/takeone-offline-render-after.mp4 && sha256sum $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}/takeone-offline-render-after.mp4 $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}/takeone-offline-render-after.png > $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}/SHA256SUMS && rm -rf -- "$W"
  visual-reference:
    command: bash scripts/verification/visual-pass.sh "$DONE_DONE_EVIDENCE_ROOT/${RUN_ID}" --no-design
  visual:
    spends: "design judgments using the approved answerer:opencode judge route (live-model probe)"
    command: bash scripts/verification/visual-pass.sh "$DONE_DONE_EVIDENCE_ROOT/${RUN_ID}" --ref "${TAKEONE_VISUAL_REF:?set the approved reference pass directory}"
  visual-desktop:
    command: bash scripts/verification/visual-pass.sh "$DONE_DONE_EVIDENCE_ROOT/${RUN_ID}" --cells "desktop-dark desktop-light" --no-design
  visual-controls:
    command: bash scripts/verification/visual-controls.sh "${TAKEONE_VISUAL_REF:?set the good reference pass directory}" "$DONE_DONE_EVIDENCE_ROOT/${RUN_ID}" --work "${TAKEONE_VISUAL_WORK:?set that pass work directory}"
  visual-design:
    spends: "design judgments using the approved answerer:opencode judge route (live-model probe)"
    command: bash scripts/verification/visual-design.sh "${TAKEONE_VISUAL_PASS:?set the candidate pass directory}" --ref "${TAKEONE_VISUAL_REF:?set the approved reference pass directory}" && cp "$TAKEONE_VISUAL_PASS"/design*.json "$TAKEONE_VISUAL_PASS"/design.log "$DONE_DONE_EVIDENCE_ROOT/"
  version:
    command: >-
      npm run build && D="$DONE_DONE_EVIDENCE_ROOT/${RUN_ID}" && mkdir -p "$D" && NODE_BIN="$(node -p process.execPath)" && P="$(dirname "$NODE_BIN")" && V="$(env -i PATH="$P" "$NODE_BIN" bin/takeone.mjs --version)" && S="$(env -i PATH="$P" "$NODE_BIN" bin/takeone.mjs -v)" && E="$(node -p 'require("./package.json").version')" && test "$V" = "$E" && test "$S" = "$E" && printf 'env -i PATH=%s node %s\n$ takeone --version\n%s\n$ takeone -v\n%s\n$ node -p require(package.json).version\n%s\nresult: equal\n' "$P" "$NODE_BIN" "$V" "$S" "$E" > "$D/version-check.txt" && printf '{"target":{"version":"%s"},"commit":"%s","start":"the built CLI with no version flag, so takeone --version is an unknown command","steps":["build the CLI with npm run build","run takeone --version and takeone -v under env -i with only node on PATH","read the version field of package.json with node","compare both outputs with the package.json version"],"result":"takeone --version and -v print the package.json version exactly, and nothing else"}\n' "$E" "$(git rev-parse HEAD)" > "$DONE_DONE_EVIDENCE_ROOT/steps.json" && echo "version check passed: takeone --version and -v both print $E"
  core:
    command: >-
      npm run build && W=$(mktemp -d) && export TAKEONE_DIR="$W/takes" TAKEONE_STATE_DIR="$W/state" && node scripts/synth-take.ts $W/synth-demo && node bin/takeone.mjs make $W/synth-demo --no-ai && node scripts/verification/visual-check.ts $W/synth-demo --name offline-dark --out $W/check --at 8,12 && mkdir -p $DONE_DONE_EVIDENCE_ROOT/${RUN_ID} && cp $W/check/*.png $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}/ && ffmpeg -y -threads 2 -filter_threads 2 -filter_complex_threads 2 -ss 5 -i $W/synth-demo/out/synth-demo.mp4 -frames:v 1 $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}/takeone-offline-render-after.png && ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,codec_name -of json $W/synth-demo/out/synth-demo.mp4 > $W/probe.json && grep -q '"width":.1920' $W/probe.json && grep -q h264 $W/probe.json && cp $W/synth-demo/out/synth-demo.mp4 $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}/takeone-offline-render-after.mp4 && sha256sum $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}/takeone-offline-render-after.mp4 $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}/takeone-offline-render-after.png > $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}/SHA256SUMS && rm -rf -- "$W" && printf '%s\n' '{"target":{"version":"0.2.0"},"commit":"'"$(git rev-parse HEAD)"'","start":"a fresh synthetic 1920x1080 Acme Analytics demo take, not yet rendered","steps":["generate the synthetic demo take with scripts/synth-take.ts","render it offline with takeone make --no-ai into a framed MP4","run the offline visual check on the rendered MP4 in its dark theme","decode a still at 5 seconds and probe the MP4 for codec, size and duration"],"result":"a framed 1920x1080 H.264 demo MP4 of about 31 seconds, with the Acme Analytics Reports screen in its frames, and a decoded still from it"}' > $DONE_DONE_EVIDENCE_ROOT/steps.json
    core: true

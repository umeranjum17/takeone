# done-done project config. `done-done init` never overwrites this file.
# The app name finds this repo's evidence and receipts from every checkout.
app: "takeone"
# This repo's coding agent, over agent in ~/.done-done/config.yaml (model, effort and the other agent settings stay there).
# agent: opencode
# Docs-only commits and sign-off board traffic keep evidence fresh: neither is
# a product change (mirrors the code/docs split in .github/workflows/ci.yml).
evidence:
  ignore_paths: ["docs/**", ".agents/**", "data/**", ".sign-off/**", "README.md", "LICENSE"]
journeys:
  # The verify-takeone canonical offline journey (synthetic take, local-only
  # planning, real render): the MP4, a decoded still and the probe are the evidence.
  offline-render:
    command: npm run build && W=$(mktemp -d) && export TAKEONE_DIR="$W/takes" TAKEONE_STATE_DIR="$W/state" && node scripts/synth-take.ts $W/synth-demo && node bin/takeone.mjs make $W/synth-demo --no-ai && node scripts/verification/visual-check.ts $W/synth-demo --name offline-dark --out $W/check --at 8,12 && mkdir -p $DONE_DONE_EVIDENCE_ROOT/${RUN_ID} && cp $W/check/*.png $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}/ && ffmpeg -y -threads 2 -filter_threads 2 -filter_complex_threads 2 -ss 5 -i $W/synth-demo/out/synth-demo.mp4 -frames:v 1 $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}/takeone-offline-render-after.png && ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,codec_name -of json $W/synth-demo/out/synth-demo.mp4 > $W/probe.json && grep -q '"width":.1920' $W/probe.json && grep -q h264 $W/probe.json && cp $W/synth-demo/out/synth-demo.mp4 $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}/takeone-offline-render-after.mp4 && sha256sum $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}/takeone-offline-render-after.mp4 $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}/takeone-offline-render-after.png > $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}/SHA256SUMS && rm -rf -- "$W"
  # The glow-reel recipe on the demo board: planned locally (OCR finds the pressed control), rendered by HyperFrames.
  glow-promo:
    command: npm run build && W=$(mktemp -d) && export TAKEONE_DIR="$W/takes" TAKEONE_STATE_DIR="$W/state" && $HOME/firstmate/config/fm-mem-gate.sh $HOME/.treehouse/firstmate-8bf1b0/1/firstmate/config/render-slot.sh node bin/takeone.mjs motion resources/demo/tidewater-board.png --recipe glow --title "Meet the crew" --pitch "Plan the launch with Umer" --press "Beta feedback" --logo Tidewater --subtitle "Ask. Delegate. Done." --tree "Crew,>Chief,>Scout" --out $W/glow && ffprobe -v error -show_entries stream=width,height,codec_name,duration -of json $W/glow/out/motion.mp4 > $DONE_DONE_EVIDENCE_ROOT/takeone-glow-after.json && grep -q h264 $DONE_DONE_EVIDENCE_ROOT/takeone-glow-after.json && ffmpeg -nostdin -y -threads 2 -ss 6.0 -i $W/glow/out/motion.mp4 -frames:v 1 -update 1 $DONE_DONE_EVIDENCE_ROOT/takeone-glow-after.png && printf '%s\n' '{"target":{"version":"'"$(node -p 'require("./package.json").version')"'"},"commit":"'"$(git rev-parse HEAD)"'","start":"a clean checkout and the staged Tidewater board screenshot, no take built yet","steps":["run takeone motion on the board with --recipe glow, a title, a typed prompt, kinetic words, a file tree and --press naming a real control, planned locally with no engine","render it through the HyperFrames engine","probe the MP4 and decode the still at 6.0 s"],"result":"a 1920x1080 h264 promo of about 9 s whose zoom beat shows the real board with the pressed control lit and the cursor on it, wordmark end card after"}' > $DONE_DONE_EVIDENCE_ROOT/steps.json && cp $W/glow/out/motion.mp4 $DONE_DONE_EVIDENCE_ROOT/takeone-glow-after.mp4 && rm -rf -- "$W"
  # The glow-reel recipe dressed by a brand file: the same plan as glow-promo with --brand, rendered by HyperFrames.
  glow-brand:
    command: npm run build && W=$(mktemp -d) && export TAKEONE_DIR="$W/takes" TAKEONE_STATE_DIR="$W/state" && G="$HOME/firstmate/config/fm-mem-gate.sh" && $G $HOME/.treehouse/firstmate-8bf1b0/1/firstmate/config/render-slot.sh node bin/takeone.mjs motion resources/demo/tidewater-board.png --recipe glow --title "Meet the crew" --pitch "Plan the launch with Umer" --press "Beta feedback" --logo Tidewater --subtitle "Ask. Delegate. Done." --tree "Crew,>Chief,>Scout" --brand resources/demo/tidewater-brand.json --out $W/glow && ffprobe -v error -show_entries stream=width,height,codec_name,duration -of json $W/glow/out/motion.mp4 > $DONE_DONE_EVIDENCE_ROOT/takeone-brand-glow-after.json && grep -q h264 $DONE_DONE_EVIDENCE_ROOT/takeone-brand-glow-after.json && grep -q 'accent.*18c8a4' $W/glow/storyboard.json && grep -q 'tidewater-mark.svg' $W/glow/storyboard.json && $G ffmpeg -nostdin -y -threads 2 -filter_threads 2 -filter_complex_threads 2 -ss 6.0 -i $W/glow/out/motion.mp4 -vf scale=1280:-2 -frames:v 1 -update 1 $DONE_DONE_EVIDENCE_ROOT/takeone-brand-glow-after.png && $G ffmpeg -nostdin -y -threads 2 -filter_threads 2 -filter_complex_threads 2 -ss 8.4 -i $W/glow/out/motion.mp4 -vf scale=1280:-2 -frames:v 1 -update 1 $DONE_DONE_EVIDENCE_ROOT/takeone-brand-glow-after-endcard.png && printf '%s\n' '{"target":{"version":"'"$(node -p 'require("./package.json").version')"'"},"commit":"'"$(git rev-parse HEAD)"'","start":"a clean checkout, the staged Tidewater board screenshot and the sample Tidewater brand file, no take built yet","steps":["run takeone motion with --recipe glow and --brand resources/demo/tidewater-brand.json, planned locally with no engine","render it through the HyperFrames engine","check the storyboard carries the brand accent and logo, probe the MP4 and decode the stills at 6.0 s and 8.4 s"],"result":"a 1920x1080 h264 promo of about 9 s in the brand teal and fonts, the zoom beat shows the real board with the pressed control lit, and the end card shows the logo mark above the Tidewater wordmark"}' > $DONE_DONE_EVIDENCE_ROOT/steps.json && cp $W/glow/out/motion.mp4 $DONE_DONE_EVIDENCE_ROOT/takeone-brand-glow-after.mp4 && rm -rf -- "$W"
  # A take rendered in a product's own brand: the same headless board take without --brand and with it
  # (palette plus a display typeface carried as a font file), a decoded still of each, the faces the
  # renderer used, the stage pixel, and the refusal an unbundled typeface name gets.
  brand-take:
    command: >-
      npm run build && export TAKEONE_RENDER_WRAP="$HOME/firstmate/config/fm-mem-gate.sh $HOME/.treehouse/firstmate-8bf1b0/1/firstmate/config/render-slot.sh"
      && bash scripts/verification/brand-take.sh "$DONE_DONE_EVIDENCE_ROOT"
  # The story recipe from a plain brief, no screenshot: planned locally, rendered by HyperFrames, judged from a contact sheet of the film.
  story-promo:
    command: npm run build && W=$(mktemp -d) && export TAKEONE_DIR="$W/takes" TAKEONE_STATE_DIR="$W/state" && G="$HOME/firstmate/config/fm-mem-gate.sh" && $G $HOME/.treehouse/firstmate-8bf1b0/1/firstmate/config/render-slot.sh node bin/takeone.mjs motion --recipe story --pitch "$(cat resources/demo/story-brief.txt)" --logo Tidewater --brand resources/demo/tidewater-brand.json --cta "Plan your crew" --url tidewater.example --out $W/story && ffprobe -v error -show_entries stream=width,height,codec_name,r_frame_rate,duration -of json $W/story/out/motion.mp4 > $DONE_DONE_EVIDENCE_ROOT/takeone-story-after.json && grep -q h264 $DONE_DONE_EVIDENCE_ROOT/takeone-story-after.json && node -e 'const s=require(process.argv[1]),r=require(process.argv[2]);if(s.scenes.filter(x=>x.pattern==="story").length!==4||!r.gates.frozen.passed||Object.keys(s.screens).length)process.exit(1)' $W/story/storyboard.json $W/story/render.json && $G ffmpeg -nostdin -y -threads 2 -filter_threads 2 -filter_complex_threads 2 -i $W/story/out/motion.mp4 -an -vf "fps=1,scale=640:-2,tile=4x5" -frames:v 1 -update 1 $DONE_DONE_EVIDENCE_ROOT/takeone-story-after.png && printf '%s\n' '{"target":{"version":"'"$(node -p 'require("./package.json").version')"'"},"commit":"'"$(git rev-parse HEAD)"'","start":"a clean checkout and a four-line text brief, no screenshot and no take built yet","steps":["run takeone motion with --recipe story, the brief, a logo and the sample Tidewater brand file, planned locally with no engine","render it through the HyperFrames engine","check the plan has four story beats and no screens and the frozen-time gate passed, probe the MP4 and decode a contact sheet at one frame a second"],"result":"a 1920x1080 h264 film of about 17 s whose beats alternate dark and light, each with its product drawn beside the headline (chips, a phone chat, paper cards, stat tiles), ending on the Tidewater end card"}' > $DONE_DONE_EVIDENCE_ROOT/steps.json && cp $W/story/out/motion.mp4 $DONE_DONE_EVIDENCE_ROOT/takeone-story-after.mp4 && rm -rf -- "$W"
  fast-preview:
    command: npm run build && export TAKEONE_PREVIEW_TAKE=$HOME/.treehouse/firstmate-8bf1b0/1/firstmate/data/t1-camera-polish2/takes/take-a TAKEONE_RENDER_WRAP="$HOME/firstmate/config/fm-mem-gate.sh $HOME/.treehouse/firstmate-8bf1b0/1/firstmate/config/render-slot.sh" && bash scripts/verification/preview-timing.sh "$DONE_DONE_EVIDENCE_ROOT"
  visual-reference:
    command: bash scripts/verification/visual-pass.sh "$DONE_DONE_EVIDENCE_ROOT/${RUN_ID}" --no-design
  visual:
    spends: "design judgments using the approved answerer:opencode judge route (live-model probe)"
    command: bash scripts/verification/visual-pass.sh "$DONE_DONE_EVIDENCE_ROOT/${RUN_ID}" --ref "${TAKEONE_VISUAL_REF:?set the approved reference pass directory}"
  visual-desktop:
    command: bash scripts/verification/visual-pass.sh "$DONE_DONE_EVIDENCE_ROOT/${RUN_ID}" --cells "desktop-dark desktop-light" --no-design
  visual-controls:
    command: bash scripts/verification/visual-controls.sh "${TAKEONE_VISUAL_REF:?set the good reference pass directory}" "$DONE_DONE_EVIDENCE_ROOT/${RUN_ID}" --work "${TAKEONE_VISUAL_WORK:?set that pass work directory}"
  visual-design:
    spends: "design judgments using the approved answerer:opencode judge route (live-model probe)"
    command: bash scripts/verification/visual-design.sh "${TAKEONE_VISUAL_PASS:?set the candidate pass directory}" --ref "${TAKEONE_VISUAL_REF:?set the approved reference pass directory}" && cp "$TAKEONE_VISUAL_PASS"/design*.json "$TAKEONE_VISUAL_PASS"/design.log "$DONE_DONE_EVIDENCE_ROOT/"
  # The output quality gates: three fixtures including the real-UI headless scene, every
  # frame's text cuts on a bound timeline, and "passed" printed only when every goal is met.
  quality:
    command: >-
      D="$DONE_DONE_EVIDENCE_ROOT/${RUN_ID}" && mkdir -p "$D" && { npm run quality > "$D/quality.log" 2>&1; s=$?; tail -8 "$D/quality.log"; test "$s" = 0; }
      && cp tmp/quality/metrics.json "$D/quality-metrics.json" && cp tmp/quality/scene/out/headless-demo.mp4 "$D/takeone-quality-scene-after.mp4"
      && node -e 'const m = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")), log = require("fs").readFileSync(process.argv[2], "utf8");
      for (const f of ["synth", "portrait", "scene"]) { const x = m.fixtures[f]; if (!x || x.cutAudit.frames !== x.cameraFrames || !("text_cut_at_rest" in x.metrics)) throw new Error(f + ": not gated on every frame"); }
      if (/quality: passed/.test(log) !== (m.goalsUnmet.length === 0)) throw new Error("the last line disagrees with goalsUnmet");
      console.log("quality journey: 3 fixtures gated on every frame; " + m.goalsUnmet.length + " goals unmet, and the run says so")' "$D/quality-metrics.json" "$D/quality.log"
      && printf '%s\n' '{"target":{"version":"'"$(node -p 'require("./package.json").version')"'"},"commit":"'"$(git rev-parse HEAD)"'","start":"a clean checkout with the stored quality baselines and goldens, no take built yet","steps":["run npm run quality: build the synth, portrait and real-UI headless scene takes, plan them locally, render each at 60 fps twice","gate every decoded output and audit every rendered frame for text cuts on the end bound to camera.json","keep the log, the metrics and the scene MP4 the gates measured","check that all three fixtures were audited on every frame and that the last line says passed only when no goal is unmet"],"result":"three fixtures gated, the real-UI scene among them, every frame audited for text cuts, and the last line lists each unmet goal instead of claiming a pass"}' > "$DONE_DONE_EVIDENCE_ROOT/steps.json"
  version:
    command: >-
      npm run build && D="$DONE_DONE_EVIDENCE_ROOT/${RUN_ID}" && mkdir -p "$D" && NODE_BIN="$(node -p process.execPath)" && P="$(dirname "$NODE_BIN")" && V="$(env -i PATH="$P" "$NODE_BIN" bin/takeone.mjs --version)" && S="$(env -i PATH="$P" "$NODE_BIN" bin/takeone.mjs -v)" && E="$(node -p 'require("./package.json").version')" && test "$V" = "$E" && test "$S" = "$E" && printf 'env -i PATH=%s node %s\n$ takeone --version\n%s\n$ takeone -v\n%s\n$ node -p require(package.json).version\n%s\nresult: equal\n' "$P" "$NODE_BIN" "$V" "$S" "$E" > "$D/version-check.txt" && printf '{"target":{"version":"%s"},"commit":"%s","start":"the built CLI with no version flag, so takeone --version is an unknown command","steps":["build the CLI with npm run build","run takeone --version and takeone -v under env -i with only node on PATH","read the version field of package.json with node","compare both outputs with the package.json version"],"result":"takeone --version and -v print the package.json version exactly, and nothing else"}\n' "$E" "$(git rev-parse HEAD)" > "$DONE_DONE_EVIDENCE_ROOT/steps.json" && echo "version check passed: takeone --version and -v both print $E"
  core:
    command: >-
      npm run build && W=$(mktemp -d) && export TAKEONE_DIR="$W/takes" TAKEONE_STATE_DIR="$W/state" && node scripts/synth-take.ts $W/synth-demo && node bin/takeone.mjs make $W/synth-demo --no-ai && node scripts/verification/visual-check.ts $W/synth-demo --name offline-dark --out $W/check --at 8,12 && mkdir -p $DONE_DONE_EVIDENCE_ROOT/${RUN_ID} && cp $W/check/*.png $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}/ && ffmpeg -y -threads 2 -filter_threads 2 -filter_complex_threads 2 -ss 5 -i $W/synth-demo/out/synth-demo.mp4 -frames:v 1 $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}/takeone-offline-render-after.png && ffprobe -v error -show_entries format=duration,size -show_entries stream=width,height,codec_name -of json $W/synth-demo/out/synth-demo.mp4 > $W/probe.json && grep -q '"width":.1920' $W/probe.json && grep -q h264 $W/probe.json && cp $W/synth-demo/out/synth-demo.mp4 $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}/takeone-offline-render-after.mp4 && sha256sum $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}/takeone-offline-render-after.mp4 $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}/takeone-offline-render-after.png > $DONE_DONE_EVIDENCE_ROOT/${RUN_ID}/SHA256SUMS && rm -rf -- "$W" && printf '%s\n' '{"target":{"version":"0.2.1"},"commit":"'"$(git rev-parse HEAD)"'","start":"a fresh synthetic 1920x1080 Acme Analytics demo take, not yet rendered","steps":["generate the synthetic demo take with scripts/synth-take.ts","render it offline with takeone make --no-ai into a framed MP4","run the offline visual check on the rendered MP4 in its dark theme","decode a still at 5 seconds and probe the MP4 for codec, size and duration"],"result":"a framed 1920x1080 H.264 demo MP4 of about 31 seconds, with the Acme Analytics Reports screen in its frames, and a decoded still from it"}' > $DONE_DONE_EVIDENCE_ROOT/steps.json
    core: true
